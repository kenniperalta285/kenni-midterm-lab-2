<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Dynamic Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <header class="card-head">
      <h1>Secure Dynamic Task Manager</h1>
      <p class="subtitle">Add, complete, edit, and remove your tasks</p>
    </header>

    <section class="controls">
      <input type="text" id="taskInput" placeholder="Enter a task">
      <div class="buttons">
        <button id="addTaskBtn">Add Task</button>
        <button id="loadSamplesBtn">Load Sample Tasks</button>
      </div>
    </section>

    <p id="taskMessage"></p>

    <section class="summary">
      <span>Total Tasks: <span id="totalCount">0</span></span>
      <span>Pending: <span id="pendingCount">0</span></span>
      <span>Completed: <span id="completedCount">0</span></span>
    </section>

    <ul id="taskList"></ul>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
